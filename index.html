<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cofre eléctrico 3D</title>
  <meta name="description" content="Modelo 3D interactivo de un cofre eléctrico de 50 kVA reconstruido a partir de video.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='25' rx='2' fill='%23c9c7c0' stroke='%23555' stroke-width='2'/%3E%3Cpath d='M17 9l-4 7h4l-2 7 6-9h-4l2-5z' fill='%23f2c200' stroke='%23333' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main id="stage" aria-label="Visor 3D del cofre eléctrico"></main>

  <div id="loader" role="status" aria-live="polite">
    <div class="bar"><span id="loader-fill"></span></div>
    <p id="loader-text">Cargando modelo…</p>
  </div>

  <p id="hint" hidden></p>

  <button id="reset" type="button" title="Restablecer vista (R)" aria-label="Restablecer vista" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script type="module" src="app.js"></script>
</body>
</html>
